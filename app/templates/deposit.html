{% extends "base.html" %}

{% block title %}
Deposit
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card wide">

        <div class="form-icon">
            💰
        </div>

        <h1>
            Deposit Funds
        </h1>

        <p>
            Add funds to your investment account.
        </p>


        <div class="payment-country">

            <strong>
                Country:
            </strong>

            {{ current_user.country }}

            <strong>
                Currency:
            </strong>

            {{ payment_options.currency }}

        </div>


        <form method="POST">

            <label>
                Deposit Amount
            </label>

            <input
                type="number"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter amount"
                required
            >


            <label>
                Payment Method
            </label>

            <select
                name="payment_method"
                required
            >

                <option value="">
                    Select payment method
                </option>

                {% for method in payment_options.methods %}

                <option value="{{ method }}">
                    {{ method }}
                </option>

                {% endfor %}

            </select>


            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                value="{{ current_user.phone or '' }}"
                placeholder="+254..."
            >


            <button
                type="submit"
                class="primary-button full-width"
            >
                Continue Payment
            </button>

        </form>

    </div>

</div>

{% endblock %}
