<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobalInvest | Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --dark-2: #172033;
            --text: #172033;
            --muted: #718096;
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e6eaf0;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 255px;
            height: 100vh;
            background: var(--dark);
            color: white;
            padding: 22px 15px;
            z-index: 1000;
            transition: transform .3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 7px 10px 28px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: 0 8px 20px rgba(37,99,235,.3);
        }

        .brand h2 {
            font-size: 18px;
            letter-spacing: -.3px;
        }

        .brand span {
            display: block;
            color: #94a3b8;
            font-size: 10px;
            margin-top: 3px;
        }

        .menu-title {
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 12px 10px 9px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 13px;
            color: #cbd5e1;
            padding: 12px 12px;
            margin-bottom: 4px;
            border-radius: 10px;
            font-size: 13px;
            transition: .2s;
        }

        .nav-link:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .nav-link.active {
            background: linear-gradient(
                90deg,
                rgba(37,99,235,.9),
                rgba(37,99,235,.55)
            );
            color: white;
            box-shadow: 0 8px 20px rgba(37,99,235,.18);
        }

        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 18px;
            left: 15px;
            right: 15px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 255px;
            min-height: 100vh;
            padding: 24px 30px 40px;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .mobile-menu {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: white;
            cursor: pointer;
            font-size: 19px;
        }

        .welcome h1 {
            font-size: 25px;
            letter-spacing: -.5px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 13px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 17px;
        }

        .notification-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 9px;
            background: white;
            border: 1px solid var(--border);
            padding: 5px 12px 5px 5px;
            border-radius: 12px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .profile strong {
            display: block;
            font-size: 12px;
        }

        .profile span {
            display: block;
            color: #94a3b8;
            font-size: 9px;
            margin-top: 2px;
        }

        /* =========================
           PORTFOLIO HERO
        ========================= */

        .portfolio {
            background:
                radial-gradient(circle at 85% 20%, rgba(56,189,248,.22), transparent 30%),
                radial-gradient(circle at 15% 90%, rgba(99,102,241,.18), transparent 30%),
                linear-gradient(135deg,#0f172a,#172554);
            border-radius: 20px;
            padding: 27px;
            color: white;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(15,23,42,.15);
        }

        .portfolio::after {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 50%;
            right: -60px;
            bottom: -110px;
        }

        .portfolio-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .portfolio-label {
            color: #a9b7d0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .portfolio-value {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.8px;
        }

        .portfolio-change {
            color: #4ade80;
            font-size: 12px;
            margin-top: 8px;
        }

        .portfolio-actions {
            display: flex;
            gap: 9px;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-light {
            background: rgba(255,255,255,.11);
            color: white;
            border: 1px solid rgba(255,255,255,.13);
        }

        .portfolio-bottom {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .portfolio-stat span {
            display: block;
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 5px;
        }

        .portfolio-stat strong {
            font-size: 14px;
        }

        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(15,23,42,.035);
        }

        .stat-card {
            padding: 18px;
        }

        .stat-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .blue-bg {
            background: #eff6ff;
        }

        .green-bg {
            background: #ecfdf5;
        }

        .purple-bg {
            background: #f5f3ff;
        }

        .orange-bg {
            background: #fff7ed;
        }

        .stat-card h3 {
            font-size: 21px;
            margin-bottom: 4px;
        }

        .stat-card p {
            color: var(--muted);
            font-size: 11px;
        }

        .trend {
            font-size: 9px;
            color: var(--success);
            background: #ecfdf5;
            padding: 5px 7px;
            border-radius: 20px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-grid {
            display: grid;
            grid-template-columns: 1.65fr 1fr;
            gap: 18px;
            margin-bottom: 20px;
        }

        .panel {
            padding: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 19px;
        }

        .panel-header h2 {
            font-size: 15px;
        }

        .panel-header p {
            color: var(--muted);
            font-size: 10px;
            margin-top: 4px;
        }

        .period {
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            padding: 7px 9px;
            color: #64748b;
            font-size: 10px;
        }

        /* =========================
           CHART
        ========================= */

        .chart-area {
            height: 205px;
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 13px;
            padding: 10px 4px 0;
            border-bottom: 1px solid #eef1f5;
        }

        .grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #edf0f4;
        }

        .line1 { top: 25%; }
        .line2 { top: 50%; }
        .line3 { top: 75%; }

        .chart-column {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }

        .chart-bar {
            width: 75%;
            max-width: 30px;
            border-radius: 7px 7px 2px 2px;
            background: linear-gradient(180deg,#3b82f6,#2563eb);
            opacity: .9;
        }

        .chart-label {
            position: absolute;
            bottom: -22px;
            color: #94a3b8;
            font-size: 9px;
        }

        /* =========================
           INVESTMENT PLANS
        ========================= */

        .plans {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .plan {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: .2s;
        }

        .plan:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .plan-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .plan-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
        }

        .plan strong {
            display: block;
            font-size: 11px;
        }

        .plan small {
            color: #94a3b8;
            font-size: 9px;
        }

        .plan-value {
            text-align: right;
        }

        .plan-value strong {
            font-size: 11px;
        }

        .plan-value span {
            display: block;
            color: #16a34a;
            font-size: 9px;
            margin-top: 2px;
        }

        /* =========================
           TRANSACTIONS
        ========================= */

        .transactions {
            margin-bottom: 20px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            text-align: left;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 600;
            padding: 10px;
            border-bottom: 1px solid #edf0f4;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #f1f3f6;
            font-size: 11px;
        }

        .transaction-name {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .transaction-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transaction-name strong {
            display: block;
            font-size: 10px;
        }

        .transaction-name span {
            color: #94a3b8;
            font-size: 8px;
        }

        .amount-positive {
            color: #16a34a;
            font-weight: 600;
        }

        .amount-negative {
            color: #dc2626;
            font-weight: 600;
        }

        .completed {
            background: #ecfdf5;
            color: #15803d;
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 8px;
        }

        /* =========================
           LOWER CARDS
        ========================= */

        .lower-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 17px;
        }

        .lower-card {
            padding: 19px;
        }

        .lower-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lower-card h3 {
            font-size: 14px;
        }

        .lower-card p {
            color: var(--muted);
            font-size: 10px;
            margin-top: 4px;
        }

        .lower-number {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0 13px;
        }

        .progress {
            height: 6px;
            background: #edf0f4;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg,#2563eb,#38bdf8);
        }

        .lower-footer {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 9px;
            margin-top: 8px;
        }

        .referral-box {
            background: #eff6ff;
            border-radius: 10px;
            padding: 11px;
            margin-top: 10px;
            font-size: 10px;
            color: #1d4ed8;
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 9px;
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 9px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 10px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:1100px) {
            .stats {
                grid-template-columns: repeat(2,1fr);
            }

            .lower-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width:850px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 18px;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                align-items: flex-start;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .profile-text {
                display: none;
            }
        }

        @media(max-width:600px) {

            .welcome h1 {
                font-size: 20px;
            }

            .welcome p {
                font-size: 11px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-card h3 {
                font-size: 18px;
            }

            .portfolio {
                padding: 20px;
            }

            .portfolio-value {
                font-size: 27px;
            }

            .portfolio-actions {
                flex-direction: column;
            }

            .portfolio-bottom {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .lower-grid {
                grid-template-columns: 1fr;
            }

            .top-actions .icon-button {
                display: none;
            }
        }
    </style>
</head>
