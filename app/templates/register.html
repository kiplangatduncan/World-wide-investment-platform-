{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <div class="form-icon">
            🚀
        </div>

        <h1>
            Create Your Account
        </h1>

        <p>
            Join the investment platform.
        </p>

        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                placeholder="Your full name"
                required
            >


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                placeholder="+254..."
            >


            <label>
                Country
            </label>

            <select name="country">

                <option value="Kenya">
                    Kenya
                </option>

                <option value="Uganda">
                    Uganda
                </option>

                <option value="Tanzania">
                    Tanzania
                </option>

                <option value="Rwanda">
                    Rwanda
                </option>

                <option value="Nigeria">
                    Nigeria
                </option>

                <option value="South Africa">
                    South Africa
                </option>

                <option value="United Kingdom">
                    United Kingdom
                </option>

                <option value="United States">
                    United States
                </option>

                <option value="Europe">
                    Europe
                </option>

            </select>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="At least 6 characters"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Repeat password"
                required
            >


            <button
                type="submit"
                class="primary-button full-width"
            >
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
