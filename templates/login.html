{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                G
            </div>

            <h1>Welcome back</h1>

            <p>
                Sign in to your GlobalVest account
            </p>

        </div>


        <form
            method="POST"
            class="form"
        >

            <label>Email address</label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Your password"
                required
            >


            <button
                type="submit"
                class="primary-button full"
            >
                Sign In
            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}
