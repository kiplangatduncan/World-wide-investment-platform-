{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                G
            </div>

            <h1>Create your account</h1>

            <p>
                Join the GlobalVest platform
            </p>

        </div>


        <form
            method="POST"
            class="form"
        >

            <label>Full name</label>

            <input
                type="text"
                name="full_name"
                placeholder="Your full name"
                required
            >


            <label>Email address</label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>Country</label>

            <select
                name="country"
                required
            >

                <option value="">
                    Select your country
                </option>

                {% for country in countries %}

                    <option value="{{ country.name }}">
                        {{ country.name }}
                    </option>

                {% endfor %}

            </select>


            <label>Phone number</label>

            <input
                type="tel"
                name="phone"
                placeholder="+254 700 000000"
                required
            >

            <small class="input-help">
                Use your international phone number.
            </small>


            <label>Preferred currency</label>

            <select
                name="currency"
                required
            >

                {% for currency in currencies %}

                    <option value="{{ currency }}">
                        {{ currency }}
                    </option>

                {% endfor %}

            </select>


            <label>Password</label>

            <input
                type="password"
                name="password"
                minlength="8"
                placeholder="Minimum 8 characters"
                required
            >


            <label>Confirm password</label>

            <input
                type="password"
                name="confirm_password"
                minlength="8"
                placeholder="Repeat your password"
                required
            >


            <button
                type="submit"
                class="primary-button full"
            >
                Create Account
            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </p>

    </div>

</div>

{% endblock %}
